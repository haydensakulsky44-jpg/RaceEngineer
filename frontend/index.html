        <p class="nav-marque">Race<span class="point">Engineer</span></p>
    </div>

    <script src="js/api.js"></script>
    <script>
        // index.html est une simple porte d'entrée : elle ne s'affiche
        // jamais vraiment, elle redirige immédiatement selon l'état de
        // connexion — connecté -> chat direct, sinon -> connexion.
        // (Un vrai site vitrine séparé pourra remplacer ceci plus tard.)
        if (isLoggedIn()) {
            window.location.replace("chat.html");
        } else {
            window.location.replace("login.html");
        }
    </script>
