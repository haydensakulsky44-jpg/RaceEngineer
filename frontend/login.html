<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — RaceEngineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a class="nav-marque" href="index.html">Race<span class="point">Engineer</span></a>
        <div class="nav-liens">
            <a class="nav-lien" href="register.html">Créer un compte</a>
        </div>
    </nav>
    <div class="bande-damier"></div>

    <div class="page-centree">
        <div class="carte-formulaire">
            <h1>Connexion</h1>
            <p class="sous-titre">Content de te revoir au stand.</p>

            <div class="message-erreur" id="erreur"></div>

            <form id="form-connexion">
                <div class="champ">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="toi@exemple.com">
                </div>
                <div class="champ">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Ton mot de passe">
                </div>
                <button class="bouton" type="submit" id="bouton-submit" style="width: 100%;">Se connecter</button>
            </form>

            <p class="lien-secondaire">Pas encore de compte ? <a href="register.html" id="lien-inscription">S'inscrire</a></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Propage le paramètre "redirect" vers le lien d'inscription,
        // pour ne pas perdre la destination si l'utilisateur bascule
        // vers "créer un compte" avant de revenir se connecter.
        (function () {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get("redirect");
            if (redirect) {
                document.getElementById("lien-inscription").href =
                    `register.html?redirect=${encodeURIComponent(redirect)}`;
            }
        })();
    </script>
    <script>
        const form = document.getElementById("form-connexion");
        const erreurBox = document.getElementById("erreur");
        const boutonSubmit = document.getElementById("bouton-submit");

        function destinationApresConnexion() {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get("redirect");
            return redirect ? redirect : "chat.html";
        }

        if (isLoggedIn()) {
            window.location.href = destinationApresConnexion();
        }

        function afficherErreur(texte) {
            erreurBox.textContent = texte;
            erreurBox.classList.add("visible");
        }

        function cacherErreur() {
            erreurBox.classList.remove("visible");
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            cacherErreur();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            boutonSubmit.disabled = true;
            boutonSubmit.textContent = "Connexion en cours...";

            try {
                await apiLogin(email, password);
                window.location.href = destinationApresConnexion();
            } catch (err) {
                afficherErreur(err.message);
                boutonSubmit.disabled = false;
                boutonSubmit.textContent = "Se connecter";
            }
        });
    </script>
</body>
</html>
